<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign Up — Stethescope</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{font-family:'Inter',sans-serif;color:#0b1c30;min-height:100vh;background:radial-gradient(at 10% 10%,rgba(193,193,255,0.55) 0,transparent 50%),radial-gradient(at 95% 15%,rgba(98,253,185,0.35) 0,transparent 50%),radial-gradient(at 50% 90%,rgba(51,215,254,0.25) 0,transparent 50%),#f8f9ff}
  h1,h2,h3,h4,.font-head{font-family:'Manrope',sans-serif}
  .grad-primary{background:linear-gradient(135deg,#1A237E 0%,#08005E 100%)}
  .card{background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);border:1px solid #c7c5d3;box-shadow:0 20px 50px rgba(8,0,94,0.12)}
  .chip{font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;padding:4px 10px;border-radius:9999px}
  .field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #c7c5d3;background:#fff;font-size:14px;transition:border .2s,box-shadow .2s}
  .field:focus{outline:none;border-color:#006c48;box-shadow:0 0 0 3px rgba(0,108,72,0.12)}
  label{font-size:13px;font-weight:600;color:#0b1c30;margin-bottom:6px;display:block}
  .oauth{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 14px;border-radius:12px;border:1px solid #c7c5d3;background:#fff;font-weight:600;font-size:14px;transition:all .2s;width:100%}
  .oauth:hover{border-color:#08005E;background:#f8f9ff}
  .phone-wrap{display:flex;align-items:stretch;border:1px solid #c7c5d3;border-radius:12px;overflow:hidden;background:#fff}
  .phone-wrap:focus-within{border-color:#006c48;box-shadow:0 0 0 3px rgba(0,108,72,0.12)}
  .phone-wrap .cc{padding:12px 12px;background:#eff4ff;font-weight:600;font-size:14px;color:#08005E;border-right:1px solid #c7c5d3}
  .phone-wrap input{flex:1;padding:12px 14px;border:none;outline:none;font-size:14px}
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="px-5 py-4 flex items-center justify-between max-w-7xl mx-auto w-full">
  <a href="index.html" class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-full grad-primary flex items-center justify-center text-white font-bold font-head shadow-lg">S</div>
    <div class="font-head font-extrabold text-[#08005E] text-xl leading-none">Stethescope</div>
  </a>
  <a href="index.html" class="text-sm font-semibold text-[#08005E] inline-flex items-center gap-1 hover:opacity-80">
    <span class="material-symbols-outlined text-base">arrow_back</span> Back to home
  </a>
</header>

<main class="flex-1 flex items-center justify-center px-5 py-10">
  <div class="card rounded-3xl p-8 md:p-10 w-full max-w-xl">
    <div class="chip bg-[#62fdb9]/40 text-[#00734d] inline-block mb-3">Sign Up</div>
    <h1 class="font-head font-extrabold text-3xl">Create your Stethescope account</h1>
    <p class="text-slate-500 mt-2 text-sm">Get started in under a minute — no credit card required.</p>

    <div class="mt-7 grid md:grid-cols-2 gap-4">
      <div class="md:col-span-2"><label for="name">Full name</label><input id="name" class="field" type="text" placeholder="Dr. Priya Sharma"/></div>
      <div class="md:col-span-2"><label for="email">Email</label><input id="email" class="field" type="email" placeholder="you@example.com"/></div>
      <div class="md:col-span-2">
        <label for="phone">Phone</label>
        <div class="phone-wrap"><div class="cc">+91</div><input id="phone" type="tel" placeholder="98765 43210"/></div>
      </div>
      <div><label for="pwd">Password</label><input id="pwd" class="field" type="password" placeholder="••••••••"/></div>
      <div><label for="cpwd">Confirm password</label><input id="cpwd" class="field" type="password" placeholder="••••••••"/></div>
      <div class="md:col-span-2">
        <label for="mcr">Medical Council Registration Number <span class="text-slate-400 font-normal">(optional)</span></label>
        <input id="mcr" class="field" type="text" placeholder="e.g. KMC/12345/2020"/>
      </div>
      <label class="md:col-span-2 flex items-start gap-2 text-sm text-slate-600 select-none">
        <input type="checkbox" class="mt-1 w-4 h-4 accent-[#006c48]"/>
        <span>I agree to the <a href="#" class="text-[#006c48] font-semibold hover:underline">Terms</a> and <a href="#" class="text-[#006c48] font-semibold hover:underline">Privacy Policy</a>.</span>
      </label>
      <button data-action="signup-submit" class="md:col-span-2 w-full grad-primary text-white py-3 rounded-xl font-bold hover:opacity-90 inline-flex items-center justify-center gap-2">
        <span class="material-symbols-outlined">rocket_launch</span> Create account
      </button>
    </div>

    <div class="flex items-center gap-3 my-6 text-xs text-slate-400">
      <div class="flex-1 h-px bg-slate-200"></div> or continue with <div class="flex-1 h-px bg-slate-200"></div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button data-action="google-auth" class="oauth">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16.1 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.5-5.2l-6.2-5.3C29.2 35.2 26.7 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.2 5.3C41.5 35.6 44 30.2 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Google
      </button>
      <button data-action="apple-auth" class="oauth">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        Apple
      </button>
    </div>

    <p class="text-xs text-slate-500 text-center mt-6">You'll start on the Free For Life plan. Upgrade anytime.</p>

    <div class="mt-5 text-center text-sm text-slate-600">
      Already have an account? <a href="signin.html" class="font-bold text-[#08005E] hover:underline">Sign in</a>
    </div>
  </div>
</main>

<footer class="py-6 text-center text-xs text-slate-400">© 2026 Stethescope · HSN:997331</footer>

<script src="app.js"></script>
</body>
</html>
